# ~1.7x faster end to end: Whisper large-v3-turbo (beam 5) is ~3x faster than
# large-v3 and keeps punctuation. On anime dialogue its output differed from
# large-v3 by 8.2% of words, against a 6.9% noise floor between large-v3's own
# beam settings.
# Avoid batch_size > 0 or beam_size: 1 with turbo: both lose most punctuation.

asr:
  params: {model: large-v3-turbo}

export:
  workers: 8
